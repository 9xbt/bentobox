insmod efi_gop

set timeout=3
set default="bentobox (AHCI mode)"

menuentry "bentobox" {
    multiboot2 /boot/image.elf root=/dev/hda
    module2 /boot/ksym.elf ksym     # ksym has to be loaded first
    module2 /modules/ata.elf ata
    module2 /modules/ext2.elf ext2
    boot
}
menuentry "bentobox (nosmp)" {
    multiboot2 /boot/image.elf root=/dev/hda nosmp
    module2 /boot/ksym.elf ksym
    module2 /modules/ata.elf ata
    module2 /modules/ext2.elf ext2
    boot
}
menuentry "bentobox (hpet override)" {
    multiboot2 /boot/image.elf root=/dev/hda hpet_mhz=10
    module2 /boot/ksym.elf ksym
    module2 /modules/ata.elf ata
    module2 /modules/ext2.elf ext2
    boot
}
menuentry "bentobox (AHCI mode)" {
    multiboot2 /boot/image.elf root=/dev/sda
    module2 /boot/ksym.elf ksym
    module2 /modules/ahci.elf ahci
    module2 /modules/ext2.elf ext2
    boot
}