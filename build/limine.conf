timeout: 3

/bentobox
    protocol: limine
    path: boot():/boot/kernel
    resolution: 1024x768
    cmdline: root=/dev/sda
    module_path: boot():/boot/initrd.tar
    module_path: boot():/boot/ahci.ko
    module_path: boot():/boot/ext2.ko

/bentobox (nosmp)
    protocol: limine
    path: boot():/boot/kernel
    resolution: 1024x768
    cmdline: root=/dev/sda nosmp
    module_path: boot():/boot/initrd.tar
    module_path: boot():/boot/ahci.ko
    module_path: boot():/boot/ext2.ko