timeout: 3

/bentobox
    protocol: limine
    path: boot():/boot/kernel
    resolution: 1024x768
    cmdline: root=/dev/sda
    module_path: boot():/boot/ahci.ko
    module_path: boot():/boot/ext2.ko

/bentobox (livecd)
    protocol: limine
    path: boot():/boot/kernel
    resolution: 1024x768
    module_path: boot():/boot/initrd.tar

/Other options
//bentobox (nosmp)
    protocol: limine
    path: boot():/boot/kernel
    resolution: 1024x768
    cmdline: root=/dev/sda nosmp
    module_path: boot():/boot/ahci.ko
    module_path: boot():/boot/ext2.ko

//bentobox (noacpi)
    protocol: limine
    path: boot():/boot/kernel
    cmdline: noacpi
    module_path: boot():/boot/initrd.tar

//bentobox (virtio)
    protocol: limine
    path: boot():/boot/kernel
    resolution: 1024x768
    cmdline: root=/dev/sda
    module_path: boot():/boot/ahci.ko
    module_path: boot():/boot/ext2.ko
    module_path: boot():/boot/virtio.ko
    module_path: boot():/boot/virtio_input.ko